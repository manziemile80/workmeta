name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API — lint, migrate, tests, security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workmeta_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: workmeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workmeta_owner -d workmeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wm_app:ci_app_password@localhost:5432/workmeta
      DATABASE_MIGRATION_URL: postgresql+asyncpg://workmeta_owner:ci_owner_password@localhost:5432/workmeta
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Create restricted role and extensions
        run: |
          psql -h localhost -U workmeta_owner -d workmeta -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE ROLE wm_app LOGIN PASSWORD 'ci_app_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE workmeta TO wm_app;
          GRANT USAGE ON SCHEMA public TO wm_app;
          SQL

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Security audit (pip)
        working-directory: apps/api
        run: pip-audit || pip install pip-audit && pip-audit

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Migration drift check
        working-directory: apps/api
        run: alembic check

      - name: Migration downgrade/upgrade round trip
        working-directory: apps/api
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Tests (unit + real database)
        working-directory: apps/api
        run: pytest -v

  web:
    name: Web — type check, build, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:web

      - name: Build
        run: npm run build:web

      - name: Security audit (npm)
        run: npm audit --omit=dev --audit-level=high

  extension:
    name: Extension — type check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:extension

      - name: Tests
        run: npm run test:extension

      - name: Build
        run: npm run build:extension

  docker:
    name: Docker — image builds
    runs-on: ubuntu-latest
    needs: [backend, web, extension]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t workmeta-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t workmeta-web:ci .

      - name: Validate production compose
        working-directory: infra
        run: |
          cp deploy/env.production.example .env.production
          docker compose -f docker-compose.prod.yml config --quiet
          rm .env.production

  # Deployment is intentionally manual (workflow_dispatch + tags). No job
  # automatically runs destructive migrations in production; see
  # docs/DEPLOYMENT.md for the gated release procedure and rollback.
