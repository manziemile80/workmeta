# WorkMeta AI staging edge proxy — listens on localhost only (127.0.0.1).
upstream workmeta_web { server web:8080; }

server {
    listen 80;
    server_name _;

    # Matches MAX_REQUEST_BODY_BYTES (12 MiB) and the web-tier cap.
    client_max_body_size 12m;

    location / {
        proxy_pass http://workmeta_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }
}
