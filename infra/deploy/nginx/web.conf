worker_rlimit_nofile 8192;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed static assets; API traffic is proxied to the API tier.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 12 MiB cap matches MAX_REQUEST_BODY_BYTES (documents: 10 MiB + slack).
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # SSE streams (chat streaming) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
    }

    # The trained-model routes are slow on purpose: uploading a recording
    # transfers a large body, reading one decodes and OCRs every frame, and
    # training or answering calls the model with retries. The API enforces
    # its own limits; the proxy only has to let them through. The body is
    # streamed rather than buffered to disk.
    location ~ ^/api/v1/organizations/[^/]+/submodels(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
