[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workmeta-api"
version = "0.1.0"
description = "WorkMeta AI platform API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "asyncpg>=0.30,<1.0",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.59,<3.0",
  "orjson>=3.10,<4.0",
  "pgvector>=0.3.6,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "structlog>=24.4,<26.0",
  "tenacity>=9.0,<10.0",
  "tiktoken>=0.8,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.8,<1.0",
]
# Reading a screen recording and the text on its frames, with nothing to
# install on the machine: PyAV carries the codec libraries and the ONNX OCR
# engine carries its models.
media = [
  "av>=14,<20",
  "pillow>=11,<14",
  "rapidocr-onnxruntime>=1.4,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running PostgreSQL database (set RUN_DB_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Usage report SQL is assembled from fixed internal fragments; every value is
# passed as a bound parameter, so there is no user-controlled SQL text.
"app/services/usage.py" = ["S608"]
# Migration seed/backfill SQL interpolates only module-level trusted constants
# (plan UUIDs), never request or user input.
"alembic/versions/*" = ["S608"]
"app/core/config.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
